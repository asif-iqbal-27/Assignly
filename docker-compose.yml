services:
  postgres:
    image: postgres:16
    container_name: assignly-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: assignly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - assignly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assignly"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  assignly_pgdata:
